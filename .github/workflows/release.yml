name: Beta Release

on:
  push:
    branches:
      - main

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Beta Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage plugin artifacts
        run: |
          mkdir -p dist
          cp packages/obsidian-plugin/main.js dist/main.js
          cp packages/obsidian-plugin/styles.css dist/styles.css

      - name: Determine beta version
        run: |
          # Root package.json holds the version the next stable release will
          # ship as; betas are pre-releases of it (bare tags, no v prefix).
          BASE_VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/${BASE_VERSION}" >/dev/null; then
            echo "::error::${BASE_VERSION} is already released; bump the version in package.json"
            exit 1
          fi
          LAST_BETA=$(git tag -l "${BASE_VERSION}-beta.*" | sed "s/^${BASE_VERSION}-beta\.//" | sort -n | tail -1)
          NEXT_BETA=$(( ${LAST_BETA:-0} + 1 ))
          BETA_VERSION="${BASE_VERSION}-beta.${NEXT_BETA}"
          echo "BETA_VERSION=${BETA_VERSION}" >> $GITHUB_ENV

      - name: Update manifests and zip
        run: |
          npm_package_version=$BETA_VERSION node scripts/version-bump.mjs
          bash scripts/zip-it.sh

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # version-bump.mjs writes both files; leaving either unstaged makes
          # `git pull --rebase` refuse to run and the push to main never lands
          git add manifest-beta.json packages/obsidian-plugin/manifest.json
          git commit -m "chore(release): updating to $BETA_VERSION [skip ci]"

          # Rebase-retry loop in case beta commit races with another push
          MAX_RETRIES=3
          PUSHED=false
          for i in $(seq 1 $MAX_RETRIES); do
            if git pull --rebase origin main && git push origin main; then
              PUSHED=true
              break
            fi
            echo "Push failed (attempt $i/$MAX_RETRIES), retrying..."
            sleep 2
          done

          if [ "$PUSHED" != true ]; then
            echo "::error::Could not push release commit to main"
            exit 1
          fi

          # Tag after the rebase so the tag points at the commit on main.
          # Bare tag — no v prefix (Obsidian/BRAT convention)
          git tag $BETA_VERSION
          git push origin $BETA_VERSION

      - name: Create GitHub pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $BETA_VERSION \
            --prerelease \
            --title "$BETA_VERSION" \
            --generate-notes \
            "release/engram.zip#Engram Obsidian Plugin" \
            dist/main.js \
            dist/manifest.json \
            manifest-beta.json \
            dist/styles.css
