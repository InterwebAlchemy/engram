name: Stable Release

# Publishes the version in root package.json as a stable release, then moves
# package.json to the next target so subsequent betas are pre-releases of it.
on:
  workflow_dispatch:
    inputs:
      next:
        description: 'Next development version after this release'
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Stable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage plugin artifacts
        run: |
          mkdir -p dist
          cp packages/obsidian-plugin/main.js dist/main.js
          cp packages/obsidian-plugin/styles.css dist/styles.css

      - name: Determine version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::${VERSION} is already released"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Update manifests and zip
        run: |
          npm_package_version=$VERSION node scripts/version-bump.mjs
          bash scripts/zip-it.sh

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json packages/obsidian-plugin/manifest.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag $VERSION

          npm version "${{ inputs.next }}" --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): begin $NEXT_VERSION development [skip ci]"

          # No rebase here: the tag must stay on the commit that was built.
          # If main moved during the run, fail and re-run the workflow.
          git push origin HEAD:main
          git push origin $VERSION

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $VERSION \
            --latest \
            --title "$VERSION" \
            --generate-notes \
            "release/engram.zip#Engram Obsidian Plugin" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css
